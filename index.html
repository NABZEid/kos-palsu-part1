<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>AU Kos Palsu</title>
<style>
:root{--sf:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",system-ui,"Segoe UI",Roboto,sans-serif;--wag:#25d366}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{height:100%;background:#000;overflow:hidden;font-family:var(--sf);color:#fff;-webkit-font-smoothing:antialiased}
body{display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 40%,#12131c,#000 70%)}
svg{display:block}
#phone{position:relative;flex:none;width:414px;height:868px;border-radius:68px;background:linear-gradient(145deg,#34343a,#0b0b0d);padding:12px;box-shadow:0 0 0 1.5px #4a4a50 inset,0 40px 120px rgba(0,0,0,.85),0 0 90px rgba(90,100,220,.14);transform-origin:center}

body.mobile #screen{border-radius:0}
.layer{position:absolute;inset:0}

#wall svg{width:100%;height:100%}#wall img{width:100%;height:100%;object-fit:cover}
#home{z-index:1;transition:transform .4s,filter .4s}
#home.hide{opacity:0;visibility:hidden}

#apps{z-index:5;pointer-events:none}

#pass{z-index:25;display:none;flex-direction:column;align-items:center;background:rgba(8,8,18,.4);backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px)}

#banner{position:absolute;top:-140px;left:10px;right:10px;z-index:40;display:flex;gap:11px;padding:12px 14px;border-radius:26px;background:rgba(48,48,54,.78);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);box-shadow:0 8px 30px rgba(0,0,0,.5);transition:top .5s cubic-bezier(.2,1.1,.3,1)}
#banner.show{top:56px}
#callb{position:absolute;top:-170px;left:10px;right:10px;z-index:45;padding:14px 16px;border-radius:30px;background:rgba(40,40,46,.86);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);box-shadow:0 8px 30px rgba(0,0,0,.55);display:flex;align-items:center;gap:12px;transition:top .5s cubic-bezier(.2,1.1,.3,1)}

#dim{z-index:60;background:#000;opacity:0;pointer-events:none;transition:opacity .8s}
#status{position:absolute;top:0;left:0;right:0;height:54px;z-index:70;display:flex;justify-content:space-between;align-items:center;padding:8px 34px 0 50px;font-weight:600;font-size:17px;pointer-events:none;letter-spacing:.2px}
#status .sr{display:flex;gap:6px;align-items:center}
#island{position:absolute;top:11px;left:50%;width:124px;height:36px;margin-left:-62px;background:#000;border-radius:20px;z-index:80;pointer-events:none}
#homebar{position:absolute;bottom:8px;left:50%;width:140px;height:5px;margin-left:-70px;border-radius:3px;background:rgba(255,255,255,.92);z-index:75;pointer-events:none}
#hbhit{position:absolute;bottom:0;left:0;right:0;height:32px;z-index:76;cursor:pointer}
#end{z-index:90;display:none;background:#000;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px;gap:18px}
#end.show{display:flex}
#intro{position:fixed;inset:0;z-index:999;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:30px;cursor:pointer;transition:opacity 1s}
#intro h1{font-size:44px;letter-spacing:.35em;font-weight:200;padding-left:.35em}
#intro p{font-size:14px;color:#8a8a93;max-width:300px;line-height:1.5}
#intro .go{margin-top:28px;font-size:13px;color:#c33;letter-spacing:.2em;animation:pulse 1.8s infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-14px)}40%{transform:translateX(12px)}60%{transform:translateX(-9px)}80%{transform:translateX(6px)}}
@keyframes buzz{0%,100%{transform:translate(0)}15%{transform:translate(-3px,1px)}30%{transform:translate(3px,-1px)}45%{transform:translate(-3px,0)}60%{transform:translate(2px,1px)}}
@keyframes gl{0%{transform:none;filter:none}15%{transform:translate(-6px,2px) skewX(3deg);filter:hue-rotate(90deg) contrast(1.6)}30%{transform:translate(7px,-3px);filter:invert(.2)}45%{transform:translate(-3px,0) skewX(-4deg);filter:saturate(3) hue-rotate(-60deg)}70%{transform:translate(4px,1px);filter:contrast(2)}100%{transform:none;filter:none}}
#screen.buzz{animation:buzz .4s}
#screen.glitch{animation:gl .6s steps(2)}
/* lock */
#lock .date{position:absolute;top:66px;width:100%;text-align:center;font-size:20px;font-weight:600;color:rgba(255,255,255,.85)}
#lock .time{position:absolute;top:82px;width:100%;text-align:center;font-size:94px;font-weight:700;letter-spacing:-2px;line-height:1.1;color:rgba(255,255,255,.9);text-shadow:0 2px 30px rgba(0,0,0,.3)}
#lnots{position:absolute;top:226px;left:12px;right:12px;display:flex;flex-direction:column;gap:8px}
.ln{display:flex;gap:11px;padding:12px 14px;border-radius:22px;background:rgba(58,58,64,.58);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);animation:lnin .5s both}
@keyframes lnin{from{opacity:0;transform:translateY(-14px) scale(.96)}}
.bic{width:38px;height:38px;border-radius:9px;overflow:hidden;flex:none}.bic svg{width:100%;height:100%}
.bt{flex:1;min-width:0}.bh{display:flex;justify-content:space-between;font-size:15px}.bh span{color:rgba(255,255,255,.55);font-size:13px}
.bb{font-size:15px;color:rgba(255,255,255,.88);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.28;margin-top:1px}
.lbtn{position:absolute;bottom:50px;width:50px;height:50px;border-radius:50%;background:rgba(40,40,46,.55);backdrop-filter:blur(20px);display:flex;align-items:center;justify-content:center}
.lhint{position:absolute;bottom:58px;width:100%;text-align:center;font-size:14px;color:rgba(255,255,255,.55);animation:pulse 2.4s infinite}
/* pass */
#pass .pt{margin-top:104px;font-size:21px;font-weight:500}
#pdots{display:flex;gap:22px;margin-top:26px;height:16px}
#pdots i{width:14px;height:14px;border-radius:50%;border:1.5px solid #fff}#pdots i.f{background:#fff}
#pdots.shake{animation:shake .45s}
.pgrid{display:grid;grid-template-columns:repeat(3,78px);gap:16px 26px;margin-top:62px}
.pk{width:78px;height:78px;border-radius:50%;background:rgba(255,255,255,.17);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:background .15s}
.pk:active{background:rgba(255,255,255,.5)}
.pk b{font-size:34px;font-weight:400;line-height:1}.pk small{font-size:9.5px;letter-spacing:2px;font-weight:600;margin-top:2px;height:11px}
.pk.t{background:none;font-size:17px;font-weight:500}.pk.t:active{background:none;opacity:.5}
/* home */
.wgt{position:absolute;top:62px;left:20px;right:20px;height:158px;border-radius:28px;background:rgba(34,34,40,.55);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);padding:16px 18px;display:flex;gap:18px}
.wgt .l small{color:#ff453a;font-weight:700;font-size:13px;letter-spacing:.5px}.wgt .l b{display:block;font-size:64px;font-weight:300;line-height:1;margin-top:4px}
.wgt .r{flex:1;display:flex;flex-direction:column;gap:12px;padding-top:2px}
.ev{border-left:3px solid #ff453a;padding-left:9px}.ev.bl{border-color:#0a84ff}.ev b{display:block;font-size:14px;font-weight:600}.ev span{font-size:12.5px;color:rgba(255,255,255,.6)}
.wl{position:absolute;top:224px;width:100%;text-align:center;font-size:11px;color:rgba(255,255,255,.7)}
.hgrid{position:absolute;top:248px;left:0;right:0;display:grid;grid-template-columns:repeat(4,60px);justify-content:space-between;padding:0 27px;row-gap:24px}
.it{display:flex;flex-direction:column;align-items:center;cursor:pointer}
.ic{position:relative;width:60px;height:60px;border-radius:13.5px;box-shadow:0 2px 8px rgba(0,0,0,.35),inset 0 0 0 .5px rgba(255,255,255,.18);transition:transform .15s}
.ic svg{width:100%;height:100%;border-radius:13.5px}
.it:active .ic{transform:scale(.9)}
.lb{font-size:11px;margin-top:5px;text-shadow:0 1px 3px rgba(0,0,0,.5);letter-spacing:.1px}
.bdg{position:absolute;top:-7px;right:-7px;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:#ff3b30;font-size:14px;font-weight:600;display:none;align-items:center;justify-content:center;z-index:2;box-shadow:0 0 0 1px rgba(0,0,0,.2)}
.ic.hint::after{content:"";position:absolute;inset:-7px;border-radius:19px;border:2.5px solid #fff;animation:ring 1.3s infinite;pointer-events:none}
@keyframes ring{0%{opacity:.9;transform:scale(.92)}100%{opacity:0;transform:scale(1.18)}}
.dock{position:absolute;bottom:20px;left:12px;right:12px;height:94px;border-radius:38px;background:rgba(255,255,255,.17);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);display:flex;justify-content:space-around;align-items:center;padding:0 10px 4px}
.srch{position:absolute;bottom:124px;left:50%;margin-left:-44px;width:88px;height:28px;border-radius:14px;background:rgba(255,255,255,.2);backdrop-filter:blur(20px);font-size:13px;display:flex;align-items:center;justify-content:center;gap:5px;color:rgba(255,255,255,.85)}
/* apps */
.app{position:absolute;inset:0;z-index:5;background:#000;overflow:hidden;display:none;opacity:0;transform:scale(.12);border-radius:48px;pointer-events:auto;transition:transform .42s cubic-bezier(.22,.9,.2,1),opacity .28s,border-radius .42s}
.app.show{opacity:1;transform:none;border-radius:0}
.big{font-size:34px;font-weight:700;letter-spacing:.2px}
.scr{position:absolute;inset:0;overflow:auto;padding:62px 18px 40px}
.scr::-webkit-scrollbar,.wa-rows::-webkit-scrollbar,.msgs::-webkit-scrollbar{display:none}
.grp{background:#1c1c1e;border-radius:14px;overflow:hidden;margin-top:14px}
.li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:.5px solid #2c2c2e;min-height:48px;font-size:17px}
.li:last-child{border:0}.li .v{margin-left:auto;color:#8e8e93;font-size:16px}.li small{display:block;color:#8e8e93;font-size:13px}
.sq{width:30px;height:30px;border-radius:7px;flex:none;position:relative}.sq::after{content:"";position:absolute;inset:8px;border-radius:50%;background:rgba(255,255,255,.9)}
.empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#8e8e93;gap:6px}.empty b{font-size:22px;color:#fff;font-weight:600}
.bar{position:absolute;bottom:0;left:0;right:0;height:84px;background:rgba(22,22,24,.94);backdrop-filter:blur(20px);border-top:.5px solid #2c2c2e;display:flex;justify-content:space-around;padding-top:8px}
.bar>div{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:#8e8e93;width:64px;cursor:pointer}.bar>div.on{color:#0a84ff}
.bar.wa>div.on{color:#25d366}
.bk{position:absolute;top:58px;left:12px;z-index:3;color:#0a84ff;font-size:17px;display:flex;align-items:center;gap:5px;cursor:pointer}
/* whatsapp */
.wa-list,.wa-room{position:absolute;inset:0;background:#000}
.wa-top{padding:58px 16px 0}
.wa-top .r1{display:flex;justify-content:space-between;align-items:center;height:36px}
.circ{width:32px;height:32px;border-radius:50%;background:#1c1c1e;display:flex;align-items:center;justify-content:center}.circ.g{background:#25d366;color:#000}
.wa-top h1{font-size:34px;font-weight:800;margin:6px 0 10px;letter-spacing:.2px}
.wa-search{height:36px;border-radius:12px;background:#1c1c1e;display:flex;align-items:center;gap:8px;padding:0 10px;color:#8e8e93;font-size:17px}
.pills{display:flex;gap:8px;margin:12px 0 6px}.pill{padding:6px 14px;border-radius:18px;background:#1c1c1e;font-size:15px;color:#aeb4b8}.pill.on{background:#0d3b2a;color:#25d366}
.wa-rows{position:absolute;top:230px;bottom:84px;left:0;right:0;overflow:auto}
.row{display:flex;gap:12px;padding:0 16px;height:76px;align-items:center;cursor:pointer}.row:active{background:#111}
.row .meta{flex:1;min-width:0;border-bottom:.5px solid #1f2c34;height:100%;display:flex;flex-direction:column;justify-content:center;gap:3px}
.row .a{display:flex;justify-content:space-between;align-items:baseline}.row .a b{font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row .a span{font-size:13.5px;color:#8e8e93}.row .a span.un{color:#25d366}
.row .c{display:flex;justify-content:space-between;align-items:center;gap:10px}.row .pv{font-size:15.5px;color:#8e8e93;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:3px;align-items:center}.row .pv.ty{color:#25d366}
.row .ub{min-width:21px;height:21px;border-radius:11px;background:#25d366;color:#000;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;padding:0 6px}
.row .rp{font-size:11px;color:#25d366;border:1px solid #25d366;border-radius:8px;padding:1px 6px;margin-left:6px;animation:pulse 1.2s infinite}
.avt{position:relative;border-radius:50%;overflow:hidden;flex:none;background:#333}.avt svg,.avt img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.wa-room{display:flex;flex-direction:column;transform:translateX(102%);transition:transform .34s cubic-bezier(.3,.8,.3,1);background:#0b141a}
.wa-room.in{transform:none}
.rh{display:flex;align-items:center;gap:8px;padding:56px 12px 8px 8px;background:#161e23;border-bottom:.5px solid #26343b;flex:none}
.rh .back{display:flex;align-items:center;gap:4px;color:#25d366;font-size:17px;cursor:pointer;min-width:44px}
.rh .rt{flex:1;min-width:0}.rh .rt b{display:block;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rh .rt small{font-size:12.5px;color:#8696a0}.rh .rt small.ty{color:#25d366}
.rh .ri{display:flex;gap:20px;color:#25d366;padding-right:6px}
.msgs{flex:1;overflow:auto;padding:10px 10px 8px;background:#0b141a radial-gradient(rgba(255,255,255,.035) 1.2px,transparent 1.4px) 0 0/22px 22px;display:flex;flex-direction:column;gap:3px}
.chip,.sysm{align-self:center;background:#182229;color:#8696a0;font-size:12.5px;padding:5px 12px;border-radius:9px;margin:8px 0;text-align:center;max-width:300px;line-height:1.35}
.sysm{background:#2a2a1f;color:#d9c77a;font-size:12px}
.b{max-width:78%;padding:6px 9px 5px;border-radius:12px;font-size:16.5px;line-height:1.28;position:relative;word-wrap:break-word;white-space:pre-wrap;animation:bin .22s both}
@keyframes bin{from{opacity:0;transform:translateY(8px) scale(.97)}}
.b.them{align-self:flex-start;background:#1f2c34;border-top-left-radius:4px}
.b.me{align-self:flex-end;background:#005c4b;border-top-right-radius:4px}

.b.me.gl{animation:bin .2s both,gl .5s}
.chips{display:none;flex-direction:column;gap:6px;padding:8px 12px;background:#0b141a}
.chips.on{display:flex}
.cp{padding:11px 14px;border-radius:18px;border:1px solid #25d366;color:#d7fbe8;font-size:15.5px;line-height:1.3;cursor:pointer;background:rgba(37,211,102,.1);animation:bin .25s both}.cp:active{background:rgba(37,211,102,.35)}
.comp{display:flex;align-items:center;gap:10px;padding:8px 10px 30px;background:#161e23;flex:none;transition:padding .3s}
.comp.kb{padding-bottom:8px}
.comp .ci{color:#25d366;width:26px;display:flex;justify-content:center}

.field .ft{white-space:pre-wrap;word-break:break-word}

.field.pending:not(.has) .ft::before{content:"Ketuk untuk membalas...";color:#25d366}
.field.pending{border-color:#25d366;animation:fp 1.3s infinite}
@keyframes fp{0%,100%{box-shadow:0 0 0 0 rgba(37,211,102,.5)}50%{box-shadow:0 0 0 5px rgba(37,211,102,0)}}
.caret{width:2px;height:19px;background:#25d366;display:none;animation:pulse .8s infinite}.field.typ .caret{display:block}

.kbd{height:0;overflow:hidden;background:#1c1c1e;flex:none;transition:height .32s cubic-bezier(.3,.8,.3,1)}

.kbi{padding:11px 3px 0}
.kbr{display:flex;justify-content:center;gap:6px;margin-bottom:12px}

.k.on{background:#fff;color:#000;transform:translateY(-7px) scale(1.15);z-index:3}
.kbb{display:flex;justify-content:space-between;padding:0 24px;color:#bbb}
/* wallpaper tanpa blur */
#wall.blur{filter:none;transform:none}

.bar.wa{background:rgba(31,44,52,.96);border-top:.5px solid #2a3942}

const ringA=new Audio(SND.ring);ringA.loop=true;ringA.preload="auto";ringA.volume=.9;
const msgA=new Audio(SND.msg);msgA.preload="auto";
function playMsg(v){try{const a=msgA.cloneNode();a.volume=v||1;const r=a.play();if(r&&r.catch)r.catch(()=>{tone(1568,0,.3,"sine",.1);tone(2093,.13,.42,"sine",.08)})}catch(e){tone(1568,0,.3,"sine",.1)}}
const sfx={
 msg(){playMsg(1)},
 pop(){playMsg(.45)},
 send(){tone(660,0,.1,"triangle",.07);tone(990,.07,.16,"triangle",.06)},
 key(){tone(rnd(1500,1900),0,.025,"square",.012)},
 bad(){tone(180,0,.18,"sawtooth",.07);tone(150,.2,.2,"sawtooth",.07)},
 knock(n){for(let i=0;i<n;i++){tone(95,i*.42,.24,"sine",.55);noise(i*.42,.18,.55,420)}},
 stat(){noise(0,.5,.05,3200)},
 hit(){tone(58,0,1.4,"sine",.45);noise(0,.7,.3,300)}
};
let ringI;
function ringStart(){ringStop();try{ringA.currentTime=0;const r=ringA.play();if(r&&r.catch)r.catch(()=>{const p=()=>{[784,988,1175,988,784,988,1175,1568].forEach((f,i)=>tone(f,i*.13,.26,"triangle",.09))};p();ringI=setInterval(p,2400)})}catch(e){}}
function ringStop(){clearInterval(ringI);try{ringA.pause();ringA.currentTime=0}catch(e){}}
let drone;
function startDrone(){const a=au();if(!a||drone)return;const g=a.createGain();g.gain.value=.0001;g.gain.linearRampToValueAtTime(.045,a.currentTime+6);[48,48.6,72.3].forEach(f=>{const o=a.createOscillator();o.type="sine";o.frequency.value=f;o.connect(g);o.start()});g.connect(a.destination);drone=g}
function droneTo(v){if(drone&&AC)drone.gain.linearRampToValueAtTime(v,AC.currentTime+3)}
function buzz(){try{navigator.vibrate&&navigator.vibrate([60,40,60])}catch(e){}const s=$("#screen");s.classList.add("buzz");setTimeout(()=>s.classList.remove("buzz"),420)}
function glitch(){const s=$("#screen");s.classList.remove("glitch");void s.offsetWidth;s.classList.add("glitch");sfx.stat();setTimeout(()=>s.classList.remove("glitch"),650)}

/* ================= banner / lock notifs ================= */
const lnots=[];let bnT;
function banner(o){
 if(st.locked){lnots.unshift(o);renderLnots();return}
 const b=$("#banner");b.innerHTML=`<div class="bic">${icon(o.icon)}</div><div class="bt"><div class="bh"><b>${esc(o.title)}</b><span>sekarang</span></div><div class="bb">${esc(o.body)}</div></div>`;
 b.onclick=()=>{hideBanner();o.tap&&o.tap()};b.classList.add("show");clearTimeout(bnT);bnT=setTimeout(hideBanner,4300);
}
function hideBanner(){$("#banner").classList.remove("show")}
function renderLnots(){const el=$("#lnots");if(!el)return;el.innerHTML=lnots.slice(0,4).map(o=>`<div class="ln"><div class="bic">${icon(o.icon)}</div><div class="bt"><div class="bh"><b>${esc(o.title)}</b><span>sekarang</span></div><div class="bb">${esc(o.body)}</div></div></div>`).join("")}
